    <style>html,body{background:#000;height:100%;margin:0;overflow:hidden}#game{width:100vw;height:100vh;display:block}#hud{color:#fff;text-shadow:0 1px 2px #000;white-space:pre-wrap;pointer-events:none;opacity:.85;font:12px/1.45 ui-monospace,Menlo,monospace;position:fixed;bottom:10px;left:12px;right:12px}@media (max-width:900px){#hud{font-size:10.5px}}#hint{color:#fff;text-shadow:0 1px 3px #000;pointer-events:none;text-align:center;justify-content:center;align-items:center;font:15px/1.6 ui-monospace,Menlo,monospace;display:flex;position:fixed;inset:0}#fatal{z-index:20;color:#fcc;white-space:pre-wrap;background:#300;padding:24px;font:13px/1.5 ui-monospace,Menlo,monospace;display:none;position:fixed;inset:0}#loading{z-index:10;background:#0d0a08;transition:opacity .8s;position:fixed;inset:0;overflow:hidden}#loading.gone{opacity:0;pointer-events:none}.no-loading #loading{display:none}#loading .shots{opacity:0;transition:opacity 1.2s;position:absolute;inset:0}#loading .shots.ready{opacity:1}#loading .shots img{object-fit:cover;opacity:0;filter:blur(2px);will-change:opacity, transform;width:100%;height:100%;animation:30s ease-in-out infinite both shot-fade,30s linear infinite both shot-drift-a;position:absolute;inset:0}#loading .shots img:nth-child(2n){animation-name:shot-fade,shot-drift-b}#loading .shots img:first-child{animation-delay:-1.5s}#loading .shots img:nth-child(2){animation-delay:3.5s}#loading .shots img:nth-child(3){animation-delay:8.5s}#loading .shots img:nth-child(4){animation-delay:13.5s}#loading .shots img:nth-child(5){animation-delay:18.5s}#loading .shots img:nth-child(6){animation-delay:23.5s}@keyframes shot-fade{0%{opacity:0}5%{opacity:1}16.667%{opacity:1}21.667%{opacity:0}to{opacity:0}}@keyframes shot-drift-a{0%{transform:scale(1.06)translate(-1.2%,.5%)}21.667%,to{transform:scale(1.13)translate(1.2%,-.5%)}}@keyframes shot-drift-b{0%{transform:scale(1.14)translate(1%,-.6%)}21.667%,to{transform:scale(1.07)translate(-1%,.4%)}}@media (prefers-reduced-mot
